openapi: 3.1.0

info:
  title: Product API Lab
  version: 1.0.0
  description: |
    REST API to manage products, currencies and product prices in different currencies.

    ## Authentication
    Read endpoints are public. Write endpoints need a Bearer token:

    1. Call `POST /auth/login` with a demo user to get a token.
    2. Click **Authorize** and paste the token.
    3. Call the write endpoints.

    The token abilities depend on the user role:

    | Role | Abilities | Can write |
    | --- | --- | --- |
    | `editor` | `products:write` | Yes |
    | `viewer` | none | No, write endpoints return `403` |

    Tokens expire after 24 hours by default. `POST /auth/logout` revokes the current token.

    ## Conventions
    - All responses are JSON, even when the client omits `Accept: application/json`.
    - Amounts are returned as strings with fixed decimals (`"89.90"`, `"4150.000000"`) to avoid
      floating point precision loss. Requests accept numbers or numeric strings with up to 2 decimals.
    - `exchange_rate` is the amount of the currency equivalent to 1 USD (USD = 1).
    - Errors have the shape `{"message": "..."}`; validation errors (`422`) also include `errors`.

    ## Rate limiting
    60 requests per minute per user (or per IP for guests). Login is limited to 5 attempts per
    minute per email and IP. Exceeding a limit returns `429` with a `Retry-After` header.

servers:
  - url: /api/v1
    description: Current host

tags:
  - name: Auth
    description: Issue and revoke API tokens.
  - name: Products
    description: Products priced in a base currency.
  - name: Prices
    description: Explicit prices of a product in other currencies.
  - name: Currencies
    description: Available currencies.

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in and get a Bearer token
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
            examples:
              editor:
                summary: Demo editor, can write (local default credentials)
                value:
                  email: demo@example.com
                  password: password
                  device_name: swagger
              viewer:
                summary: Demo viewer, read only (local default credentials)
                value:
                  email: viewer@example.com
                  password: password
                  device_name: swagger
      responses:
        '200':
          description: Token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '422':
          description: Missing fields or wrong credentials. Wrong email and wrong password return the same error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                message: These credentials do not match our records.
                errors:
                  email:
                    - These credentials do not match our records.
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current token
      description: Only the token used in this request is revoked; other tokens of the user keep working.
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Token revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/me:
    get:
      tags: [Auth]
      summary: Get the owner of the current token
      operationId: me
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated user.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /products:
    get:
      tags: [Products]
      summary: List products
      description: Paginated list ordered by id, including the base currency of each product.
      operationId: listProducts
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: A page of products.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [Products]
      summary: Create a product
      operationId: createProduct
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Product created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /products/{product}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [Products]
      summary: Get a product
      operationId: getProduct
      responses:
        '200':
          description: The product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductEnvelope'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags: [Products]
      summary: Replace a product
      description: Every field is required.
      operationId: replaceProduct
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '200':
          description: Product updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      tags: [Products]
      summary: Update some fields of a product
      description: Only the fields sent are validated and updated.
      operationId: updateProduct
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductPatch'
            example:
              price: 79.90
      responses:
        '200':
          description: Product updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags: [Products]
      summary: Delete a product
      description: The prices of the product are deleted too.
      operationId: deleteProduct
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Product deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /products/{product}/prices:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [Prices]
      summary: List the prices of a product
      description: Prices in currencies other than the base one, ordered by currency id.
      operationId: listProductPrices
      responses:
        '200':
          description: Prices of the product.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductPrice'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [Prices]
      summary: Register a price for a product
      description: |
        A product has at most one price per currency, and the base currency cannot be used:
        its price is the `price` field of the product.
      operationId: createProductPrice
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductPriceInput'
      responses:
        '201':
          description: Price created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ProductPrice'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '422':
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                duplicate:
                  summary: Currency already used by this product
                  value:
                    message: The product already has a price in this currency.
                    errors:
                      currency_id:
                        - The product already has a price in this currency.
                baseCurrency:
                  summary: Base currency of the product
                  value:
                    message: The base currency price is the product price; choose another currency.
                    errors:
                      currency_id:
                        - The base currency price is the product price; choose another currency.
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /currencies:
    get:
      tags: [Currencies]
      summary: List currencies
      description: All currencies ordered by ISO code. Use their ids in `currency_id`.
      operationId: listCurrencies
      responses:
        '200':
          description: Available currencies.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Currency'
        '429':
          $ref: '#/components/responses/TooManyRequests'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token returned by `POST /auth/login`.

  parameters:
    ProductId:
      name: product
      in: path
      required: true
      description: Product id.
      schema:
        type: integer
        example: 1
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      required: false
      description: Items per page. Values outside 1-100 are clamped.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 15

  schemas:
    Amount:
      type: string
      pattern: '^\d+\.\d{2}$'
      description: Decimal amount with 2 decimals.
      example: '89.90'

    AmountInput:
      oneOf:
        - type: number
        - type: string
      description: Non negative amount with up to 2 decimals, maximum 9999999999.99.
      example: 89.90

    Currency:
      type: object
      required: [id, name, symbol, exchange_rate]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          description: ISO 4217 code.
          example: USD
        symbol:
          type: string
          example: $
        exchange_rate:
          type: string
          description: Amount of this currency equivalent to 1 USD, with 6 decimals.
          example: '1.000000'

    Product:
      type: object
      required: [id, name, description, price, currency_id, currency, tax_cost, manufacturing_cost, created_at, updated_at]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Teclado mecánico TKL
        description:
          type: string
          example: Teclado mecánico sin pad numérico con switches táctiles y retroiluminación RGB.
        price:
          $ref: '#/components/schemas/Amount'
        currency_id:
          type: integer
          example: 1
        currency:
          $ref: '#/components/schemas/Currency'
        tax_cost:
          allOf:
            - $ref: '#/components/schemas/Amount'
          example: '17.08'
        manufacturing_cost:
          allOf:
            - $ref: '#/components/schemas/Amount'
          example: '32.50'
        created_at:
          type: string
          format: date-time
          example: '2026-10-28T21:07:39.000000Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-10-28T21:07:39.000000Z'

    ProductInput:
      type: object
      required: [name, description, price, currency_id, tax_cost, manufacturing_cost]
      properties:
        name:
          type: string
          maxLength: 255
          example: Escritorio elevable
        description:
          type: string
          maxLength: 5000
          example: Escritorio con motor eléctrico y altura regulable.
        price:
          $ref: '#/components/schemas/AmountInput'
        currency_id:
          type: integer
          description: Id of an existing currency.
          example: 1
        tax_cost:
          allOf:
            - $ref: '#/components/schemas/AmountInput'
          example: 28.50
        manufacturing_cost:
          allOf:
            - $ref: '#/components/schemas/AmountInput'
          example: 70

    ProductPatch:
      type: object
      description: Any subset of the product fields.
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 5000
        price:
          $ref: '#/components/schemas/AmountInput'
        currency_id:
          type: integer
        tax_cost:
          $ref: '#/components/schemas/AmountInput'
        manufacturing_cost:
          $ref: '#/components/schemas/AmountInput'

    ProductEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Product'

    ProductPage:
      type: object
      required: [data, links, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        links:
          type: object
          properties:
            first:
              type: [string, 'null']
              example: http://product-api-lab.test/api/v1/products?page=1
            last:
              type: [string, 'null']
              example: http://product-api-lab.test/api/v1/products?page=1
            prev:
              type: [string, 'null']
              example: null
            next:
              type: [string, 'null']
              example: null
        meta:
          type: object
          properties:
            current_page:
              type: integer
              example: 1
            from:
              type: [integer, 'null']
              example: 1
            last_page:
              type: integer
              example: 1
            path:
              type: string
              example: http://product-api-lab.test/api/v1/products
            per_page:
              type: integer
              example: 15
            to:
              type: [integer, 'null']
              example: 8
            total:
              type: integer
              example: 8

    ProductPrice:
      type: object
      required: [id, product_id, currency_id, currency, price, created_at, updated_at]
      properties:
        id:
          type: integer
          example: 1
        product_id:
          type: integer
          example: 1
        currency_id:
          type: integer
          example: 2
        currency:
          allOf:
            - $ref: '#/components/schemas/Currency'
          example:
            id: 2
            name: EUR
            symbol: €
            exchange_rate: '0.920000'
        price:
          allOf:
            - $ref: '#/components/schemas/Amount'
          example: '82.71'
        created_at:
          type: string
          format: date-time
          example: '2026-10-28T21:07:39.000000Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-10-28T21:07:39.000000Z'

    ProductPriceInput:
      type: object
      required: [currency_id, price]
      properties:
        currency_id:
          type: integer
          description: Existing currency, different from the product base currency and not yet used by this product.
          example: 6
        price:
          $ref: '#/components/schemas/AmountInput'

    User:
      type: object
      required: [id, name, email, role]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Demo User
        email:
          type: string
          format: email
          example: demo@example.com
        role:
          type: string
          enum: [editor, viewer]
          example: editor

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        device_name:
          type: string
          maxLength: 255
          description: Name stored with the token. Defaults to `api`.

    LoginResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [token, token_type, abilities, expires_at, user]
          properties:
            token:
              type: string
              example: 1|xKq3r9TzQvYp8wLmN2bH6cJdF4gA7sE0uV5iO1kR
            token_type:
              type: string
              example: Bearer
            abilities:
              type: array
              items:
                type: string
              example: [products:write]
            expires_at:
              type: string
              format: date-time
              example: '2026-10-29T21:37:36.000000Z'
            user:
              $ref: '#/components/schemas/User'

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string

    ValidationError:
      type: object
      required: [message, errors]
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

  responses:
    Unauthorized:
      description: Missing, invalid, expired or revoked token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Unauthenticated.
    Forbidden:
      description: The token does not have the `products:write` ability (viewer role).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: This token does not have permission to perform this action.
    ProductNotFound:
      description: The product does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Product not found.
    ValidationFailed:
      description: Validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          example:
            message: The price field must be at least 0. (and 1 more error)
            errors:
              price:
                - The price field must be at least 0.
              currency_id:
                - The selected currency id is invalid.
    TooManyRequests:
      description: Rate limit exceeded. Retry after the seconds in the `Retry-After` header.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Too Many Attempts.
